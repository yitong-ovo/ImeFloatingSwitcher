name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'yitong-ovo/ImeFloatingSwitcher'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate tag and app version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          app_version_name="$(awk -F= '$1 == "appVersionName" {print $2}' gradle.properties | tr -d '[:space:]')"
          app_version_code="$(awk -F= '$1 == "appVersionCode" {print $2}' gradle.properties | tr -d '[:space:]')"

          test -n "$app_version_name"
          test -n "$app_version_code"
          test "$tag_version" = "$app_version_name"
          [[ "$app_version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$app_version_code" =~ ^[0-9]+$ ]]

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ImeFloatingSwitcher-release.p12"
          chmod 600 "$RUNNER_TEMP/ImeFloatingSwitcher-release.p12"

      - name: Verify tagged build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ImeFloatingSwitcher-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          apk="ImeFloatingSwitcher-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="ImeFloatingSwitcher-${version}.apk"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "本次 Release 包含由 GitHub Actions 构建并签名的 APK，以及对应的 SHA-256 校验文件。" \
            "$apk" \
            "$apk.sha256"
